<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>MergeGlory — Dev Gamification Dashboard</title>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f;--bg2:#0c1220;--bg3:#141e33;--bg4:#1c2a47;
  --text:#e8ecf4;--text2:#8b9cc0;--text3:#5a6b8a;
  --accent:#7c3aed;--accent2:#a78bfa;--accent-glow:rgba(124,58,237,.35);
  --gold:#fbbf24;--gold-glow:rgba(251,191,36,.25);--silver:#94a3b8;--bronze:#d97706;
  --green:#10b981;--green-glow:rgba(16,185,129,.2);
  --red:#f43f5e;--red-glow:rgba(244,63,94,.2);
  --amber:#f59e0b;--cyan:#22d3ee;--cyan-glow:rgba(34,211,238,.2);
  --purple:#a855f7;--pink:#ec4899;
  --neon-blue:#38bdf8;--neon-green:#4ade80;
  --radius:12px;--radius-lg:16px;
  --card-border:1px solid rgba(124,58,237,.15);
  --glass:rgba(12,18,32,.85);
}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

/* Animated gradient BG */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:
  radial-gradient(ellipse 800px 600px at 10% 20%, rgba(124,58,237,.08) 0%, transparent 70%),
  radial-gradient(ellipse 600px 500px at 85% 75%, rgba(34,211,238,.06) 0%, transparent 70%),
  radial-gradient(ellipse 500px 400px at 50% 50%, rgba(244,63,94,.04) 0%, transparent 70%);
  pointer-events:none;z-index:0;animation:bgPulse 20s ease-in-out infinite alternate}

/* ===== LAYOUT ===== */
.dashboard{display:grid;grid-template-rows:72px 1fr 230px;grid-template-columns:460px 1fr;width:1920px;height:1080px;position:relative;z-index:1}
.boss-bar{grid-column:1/-1;background:linear-gradient(180deg,rgba(12,18,32,.95),rgba(12,18,32,.8));backdrop-filter:blur(20px);border-bottom:1px solid rgba(124,58,237,.2);display:flex;align-items:center;padding:0 36px;gap:24px}
.leaderboard{grid-row:2;grid-column:1;background:var(--glass);backdrop-filter:blur(16px);border-right:1px solid rgba(124,58,237,.12);overflow:hidden;display:flex;flex-direction:column}
.activity-feed{grid-row:2;grid-column:2;overflow:hidden;display:flex;flex-direction:column;padding:20px 28px}
.spotlight{grid-column:1/-1;background:linear-gradient(0deg,rgba(12,18,32,.95),rgba(12,18,32,.8));backdrop-filter:blur(20px);border-top:1px solid rgba(124,58,237,.2);overflow:hidden;position:relative}

/* ===== BOSS FIGHT BAR ===== */
.boss-bar .boss-icon{font-size:32px;filter:drop-shadow(0 0 8px var(--red-glow));animation:bossIconPulse 2s ease-in-out infinite}
.boss-bar .boss-label{font-size:16px;font-weight:800;color:var(--red);text-transform:uppercase;letter-spacing:3px;white-space:nowrap;text-shadow:0 0 12px var(--red-glow)}
.boss-bar .boss-track{flex:1;height:32px;background:rgba(5,8,15,.6);border-radius:16px;position:relative;overflow:hidden;border:1px solid rgba(244,63,94,.15);box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.boss-bar .boss-fill{height:100%;background:linear-gradient(90deg,#dc2626,#f59e0b,#fbbf24);border-radius:16px;transition:width 1.5s cubic-bezier(.4,0,.2,1);position:relative;box-shadow:0 0 20px rgba(239,68,68,.3)}
.boss-bar .boss-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.2) 50%,transparent 100%);animation:shimmer 2s infinite}
.boss-bar .boss-fill::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent);border-radius:16px 16px 0 0}
.boss-bar .boss-stats{font-size:20px;font-weight:800;white-space:nowrap;min-width:150px;text-align:right;color:var(--amber);text-shadow:0 0 10px rgba(245,158,11,.3)}
.boss-bar .boss-timer{font-size:14px;color:var(--text2);white-space:nowrap;font-weight:600;letter-spacing:1px}

/* ===== LEADERBOARD ===== */
.lb-header{padding:20px 24px;font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:3px;background:linear-gradient(90deg,var(--accent),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;border-bottom:1px solid rgba(124,58,237,.15);display:flex;align-items:center;gap:12px}
.lb-header::before{content:'';-webkit-text-fill-color:initial}
.lb-list{flex:1;overflow:hidden;padding:8px 10px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);margin-bottom:4px;transition:all .6s cubic-bezier(.4,0,.2,1);position:relative;border:1px solid transparent}
.lb-row:hover,.lb-row.highlight{background:rgba(124,58,237,.08);border-color:rgba(124,58,237,.15)}
.lb-row.rank-1{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(251,191,36,.02));border-color:rgba(251,191,36,.2);box-shadow:0 0 20px rgba(251,191,36,.05)}
.lb-row.rank-2{background:linear-gradient(135deg,rgba(148,163,184,.08),rgba(148,163,184,.02));border-color:rgba(148,163,184,.15)}
.lb-row.rank-3{background:linear-gradient(135deg,rgba(217,119,6,.08),rgba(217,119,6,.02));border-color:rgba(217,119,6,.15)}
.lb-rank{width:36px;font-size:22px;font-weight:900;text-align:center;flex-shrink:0}
.lb-rank.gold{color:var(--gold);text-shadow:0 0 12px var(--gold-glow)}
.lb-rank.silver{color:var(--silver)}
.lb-rank.bronze{color:var(--bronze)}
.lb-avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;position:relative;overflow:visible}
.lb-avatar img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--bg3);transition:border-color .3s,box-shadow .3s}
.lb-row.rank-1 .lb-avatar img{border-color:var(--gold);box-shadow:0 0 12px var(--gold-glow)}
.lb-row.rank-2 .lb-avatar img{border-color:var(--silver)}
.lb-row.rank-3 .lb-avatar img{border-color:var(--bronze)}
.lb-avatar.ghost{opacity:.4;filter:grayscale(.7)}
.lb-avatar.ghost::after{content:'👻';position:absolute;top:-6px;right:-8px;font-size:16px;z-index:2}
.lb-avatar .avatar-fallback{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;border:2px solid var(--bg3)}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-top:1px}
.lb-streak{font-size:14px;flex-shrink:0;white-space:nowrap}
.lb-xp{font-size:15px;font-weight:800;flex-shrink:0;min-width:70px;text-align:right;background:linear-gradient(135deg,var(--accent2),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lb-bar{width:60px;height:6px;background:rgba(5,8,15,.5);border-radius:3px;overflow:hidden;flex-shrink:0;border:1px solid rgba(124,58,237,.1)}
.lb-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:3px;transition:width .8s;position:relative}
.lb-bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 4s infinite}
.lb-belts{display:flex;gap:3px;flex-shrink:0}
.lb-belt{font-size:14px;cursor:default;filter:drop-shadow(0 0 4px rgba(255,255,255,.3))}

/* ===== ACTIVITY FEED ===== */
.feed-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(124,58,237,.12)}
.feed-header h2{font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:3px;background:linear-gradient(90deg,var(--neon-green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.feed-timer{font-size:14px;font-weight:700;letter-spacing:1px}
.feed-timer.green{color:var(--green);text-shadow:0 0 8px var(--green-glow)}
.feed-timer.amber{color:var(--amber)}
.feed-timer.red{color:var(--red);text-shadow:0 0 8px var(--red-glow)}
.feed-list{flex:1;overflow:hidden}
.feed-item{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:var(--radius);margin-bottom:6px;background:rgba(12,18,32,.6);animation:slideInLeft .4s ease-out;border-left:3px solid var(--bg3);border:1px solid rgba(124,58,237,.08);transition:background .3s,border-color .3s}
.feed-item.commit{border-left:3px solid var(--accent);background:linear-gradient(90deg,rgba(124,58,237,.06),transparent)}
.feed-item.pr-opened{border-left:3px solid var(--cyan);background:linear-gradient(90deg,rgba(34,211,238,.06),transparent)}
.feed-item.pr-merged{border-left:3px solid var(--green);background:linear-gradient(90deg,rgba(16,185,129,.06),transparent)}
.feed-item.review{border-left:3px solid var(--purple);background:linear-gradient(90deg,rgba(168,85,247,.06),transparent)}
.feed-item.issue{border-left:3px solid var(--amber);background:linear-gradient(90deg,rgba(245,158,11,.06),transparent)}
.feed-item.badge{border-left:3px solid var(--gold);background:linear-gradient(90deg,rgba(251,191,36,.06),transparent)}
.feed-item.level-up{border-left:3px solid var(--pink);background:linear-gradient(90deg,rgba(236,72,153,.06),transparent)}
.feed-item.streak{border-left:3px solid var(--red);background:linear-gradient(90deg,rgba(244,63,94,.06),transparent)}
.feed-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;overflow:hidden}
.feed-avatar img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--bg3)}
.feed-avatar .avatar-fallback{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.feed-content{flex:1;min-width:0}
.feed-action{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-action strong{color:var(--text);font-weight:700}
.feed-action span{color:var(--text2)}
.feed-repo{font-size:11px;color:var(--text3);margin-top:2px;font-weight:500}
.feed-xp{font-size:13px;font-weight:800;color:var(--neon-green);flex-shrink:0;text-shadow:0 0 8px rgba(74,222,128,.3)}
.feed-time{font-size:11px;color:var(--text3);flex-shrink:0;min-width:50px;text-align:right}

/* ===== SPOTLIGHT PANEL ===== */
.spotlight-container{width:100%;height:100%;padding:24px 40px;display:flex;align-items:center;justify-content:center;animation:fadeIn .6s ease-out}
.spotlight-title{position:absolute;top:14px;left:40px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:var(--text3)}
.spotlight-dots{position:absolute;top:14px;right:40px;display:flex;gap:8px}
.spotlight-dot{width:8px;height:8px;border-radius:50%;background:var(--bg4);transition:all .3s}
.spotlight-dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}

/* Spotlight: MVP */
.mvp-card{display:flex;align-items:center;gap:48px}
.mvp-avatar{width:100px;height:100px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 40px var(--gold-glow),0 0 80px rgba(251,191,36,.1);animation:mvpGlow 3s ease-in-out infinite;position:relative}
.mvp-avatar img{width:100%;height:100%;object-fit:cover}
.mvp-avatar .avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#fff}
.mvp-crown{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:28px;filter:drop-shadow(0 0 6px var(--gold-glow));animation:crownBob 2s ease-in-out infinite;z-index:3}
.mvp-info h3{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--gold),#fde68a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mvp-info .mvp-title{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:3px;margin-top:4px;font-weight:700}
.mvp-stats{display:flex;gap:28px;margin-top:16px}
.mvp-stat{text-align:center;padding:8px 12px;background:rgba(124,58,237,.08);border-radius:var(--radius);border:1px solid rgba(124,58,237,.12)}
.mvp-stat .val{font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mvp-stat .lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:2px}

/* Spotlight: Duel */
.duel-container{display:flex;align-items:center;gap:28px;width:100%}
.duel-player{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:140px}
.duel-player .duel-avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--bg4)}
.duel-player .duel-avatar img{width:100%;height:100%;object-fit:cover}
.duel-player .duel-avatar .avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff}
.duel-player .duel-name{font-size:16px;font-weight:800}
.duel-player .duel-xp{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.duel-vs{font-size:32px;font-weight:900;color:var(--red);text-shadow:0 0 20px var(--red-glow);animation:vsPulse 1.5s ease-in-out infinite}
.duel-bars{flex:1}
.duel-bar-track{height:24px;background:rgba(5,8,15,.5);border-radius:12px;overflow:hidden;display:flex;border:1px solid rgba(124,58,237,.12)}
.duel-bar-left{height:100%;background:linear-gradient(90deg,var(--cyan),var(--accent));transition:width 1s;box-shadow:0 0 10px var(--cyan-glow)}
.duel-bar-right{height:100%;background:linear-gradient(90deg,var(--pink),var(--red));transition:width 1s;box-shadow:0 0 10px var(--red-glow)}

/* Spotlight: Streaks */
.streak-wall{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.streak-card{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(34,211,238,.05));padding:10px 16px;border-radius:var(--radius);border:1px solid rgba(124,58,237,.12)}
.streak-card .streak-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden}
.streak-card .streak-avatar img{width:100%;height:100%;object-fit:cover}
.streak-card .streak-avatar .avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.streak-card .streak-name{font-size:14px;font-weight:700}
.streak-card .streak-count{font-size:20px;font-weight:900;color:var(--amber);text-shadow:0 0 8px rgba(245,158,11,.3)}

/* Spotlight: Shame */
.shame-list{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.shame-card{background:linear-gradient(135deg,rgba(244,63,94,.06),rgba(12,18,32,.8));border-radius:var(--radius);padding:14px 18px;border-left:3px solid var(--red);border:1px solid rgba(244,63,94,.15);max-width:300px}
.shame-card .shame-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shame-card .shame-repo{font-size:11px;color:var(--text3)}
.shame-card .shame-time{font-size:14px;color:var(--red);font-weight:800;margin-top:4px;text-shadow:0 0 6px var(--red-glow)}

/* Spotlight: Velocity */
.velocity-chart{width:100%;max-width:900px;height:140px}

/* Spotlight: Trophy Case */
.trophy-grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.trophy-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px;background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(12,18,32,.6));border-radius:var(--radius);border:1px solid rgba(124,58,237,.12);transition:transform .3s,box-shadow .3s}
.trophy-item:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--accent-glow)}
.trophy-item .trophy-icon{font-size:32px;filter:drop-shadow(0 0 4px rgba(255,255,255,.2))}
.trophy-item .trophy-name{font-size:11px;color:var(--text2);text-align:center;font-weight:600}

/* Spotlight: Fun Stat */
.fun-stat{text-align:center}
.fun-stat .fun-stat-value{font-size:56px;font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--cyan),var(--neon-green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:statGlow 3s ease-in-out infinite}
.fun-stat .fun-stat-label{font-size:18px;color:var(--text2);margin-top:10px;font-weight:500}

/* Spotlight: Badge */
.badge-showcase{display:flex;align-items:center;gap:40px}
.badge-large-icon{font-size:80px;animation:badgeFloat 3s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,255,255,.2))}
.badge-details h3{font-size:30px;font-weight:900}
.badge-details .badge-rarity{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:3px;margin-top:6px}
.badge-rarity.common{color:var(--text2)}
.badge-rarity.rare{color:var(--cyan);text-shadow:0 0 8px var(--cyan-glow)}
.badge-rarity.legendary{color:var(--gold);text-shadow:0 0 12px var(--gold-glow);animation:legendaryPulse 2s infinite}
.badge-details .badge-earner{font-size:16px;color:var(--text2);margin-top:10px}

/* ===== OVERLAYS ===== */
.overlay{position:fixed;top:0;left:0;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;z-index:1000;pointer-events:none}
.level-up-overlay{background:radial-gradient(ellipse at center,rgba(124,58,237,.25),rgba(5,8,15,.6));animation:flashIn .3s ease-out}
.level-up-overlay .lu-content{text-align:center;animation:scaleIn .5s ease-out}
.lu-content .lu-avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 20px;border:4px solid var(--accent);box-shadow:0 0 40px var(--accent-glow),0 0 80px rgba(124,58,237,.15);overflow:hidden}
.lu-content .lu-avatar img{width:100%;height:100%;object-fit:cover}
.lu-content .lu-label{font-size:22px;color:var(--accent2);text-transform:uppercase;letter-spacing:6px;font-weight:800}
.lu-content .lu-name{font-size:52px;font-weight:900;margin:12px 0;background:linear-gradient(135deg,var(--text),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lu-content .lu-title{font-size:36px;font-weight:900;background:linear-gradient(135deg,var(--gold),#fde68a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.boss-victory-overlay{background:radial-gradient(ellipse at center,rgba(16,185,129,.2),rgba(5,8,15,.6));animation:flashIn .3s ease-out}
.boss-victory-overlay .bv-content{text-align:center;animation:scaleIn .6s ease-out}
.bv-content .bv-label{font-size:36px;font-weight:900;background:linear-gradient(135deg,var(--green),var(--neon-green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase;letter-spacing:6px}
.bv-content .bv-sub{font-size:20px;color:var(--text2);margin-top:16px;font-weight:600}
.overtaken-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:6px;animation:overtakenAnim 2.5s ease-out forwards;z-index:999;pointer-events:none;text-shadow:0 0 30px var(--red-glow),0 0 60px rgba(244,63,94,.2)}
.xp-float{position:absolute;font-size:15px;font-weight:900;color:var(--neon-green);animation:floatUp 1.5s ease-out forwards;pointer-events:none;z-index:100;text-shadow:0 0 8px rgba(74,222,128,.5)}

/* ===== PARTICLES ===== */
.particle{position:fixed;width:3px;height:3px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;animation:particleFloat 8s ease-in-out infinite}

/* ===== CONFETTI ===== */
.confetti-piece{position:fixed;width:10px;height:10px;z-index:1001;pointer-events:none;animation:confettiFall 3s ease-in forwards}

/* ===== ANIMATIONS ===== */
@keyframes bgPulse{0%{opacity:.8}50%{opacity:1}100%{opacity:.8}}
@keyframes bossIconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
@keyframes slideInLeft{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes flashIn{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:1}}
@keyframes scaleIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes legendaryPulse{0%,100%{opacity:1;text-shadow:0 0 12px var(--gold-glow)}50%{opacity:.7;text-shadow:0 0 24px var(--gold-glow)}}

<script>
// ===================================================================
// CONFIG — Edit these values
// ===================================================================
const CONFIG = {
  pat: "ghp_YOUR_PAT_HERE",
  org: "Societe-tangeroise-de-maintenance",
  repos: [],                  // empty = all org repos, or specify ["repo1","repo2"]
  pollInterval: 10,           // seconds — event stream poll (fast, uses ETag)
  fullSyncInterval: 300,      // seconds — full data reconciliation (heavy)
  weeklyResetDay: 1,          // 0=Sunday, 1=Monday
  bossGoals: [
    { label: "Close 30 issues", metric: "issuesClosed", target: 30 },
    { label: "Merge 20 PRs", metric: "prsMerged", target: 20 },
    { label: "Hit 200 commits", metric: "commits", target: 200 },
  ],
  spotlightInterval: 30,      // seconds between spotlight panel rotations
  theme: "dark",
  teamName: "Dev Team",
};

// ===================================================================
// STATE
// ===================================================================
const STATE = {
  members: [],      // { login, name, avatarUrl, color }
  devStats: {},     // keyed by login
  orgStats: { issuesClosed: 0, prsMerged: 0, commits: 0, commitsToday: 0 },
  activityFeed: [], // { type, user, repo, message, xp, time }
  boss: null,
  bossProgress: 0,
  bossDefeatedAt: null,
  weekStart: null,
  spotlightIndex: 0,
  recentBadge: null,
  lastCommitTime: Date.now(),
  repos: [],
  previousRanks: {},
  belts: { reviewer: null, closer: null, speedKing: null },
};

// ===================================================================
// HELPERS
// ===================================================================
const AVATAR_COLORS = [
  '#6366f1','#ec4899','#06b6d4','#f59e0b','#22c55e','#a855f7',
  '#ef4444','#14b8a6','#f97316','#8b5cf6','#0ea5e9','#d946ef',
];

function getInitials(name) {
  if (!name) return '??';
  const parts = name.split(/[\s_-]+/);
  return parts.length >= 2
    ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
    : name.substring(0, 2).toUpperCase();
}

function getColor(login) {
  let hash = 0;
  for (let i = 0; i < login.length; i++) hash = login.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

// ===================================================================
// AVATAR HELPER — returns <img> with fallback
// ===================================================================
function avatarHtml(login, size, extraClass) {
  const member = STATE.members.find(m => m.login === login);
  const url = member?.avatarUrl;
  const color = member?.color || getColor(login);
  const initials = getInitials(login);
  const cls = extraClass ? ` ${extraClass}` : '';
  if (url) {
    return `<img src="${escapeHtml(url)}&s=${size * 2}" alt="${escapeHtml(login)}" width="${size}" height="${size}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="avatar-fallback${cls}" style="background:${color};display:none;width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px">${initials}</div>`;
  }
  return `<div class="avatar-fallback${cls}" style="background:${color};width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px">${initials}</div>`;
}

// ===================================================================
// SOUND SYSTEM — Web Audio API synthesized sounds
// ===================================================================
const SFX = {
  _ctx: null,
  _enabled: true,
  _getCtx() {
    if (!this._ctx) {
      try { this._ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { this._enabled = false; }
    }
    return this._ctx;
  },
  _play(freq, type, duration, vol, ramp) {
    if (!this._enabled) return;
    const ctx = this._getCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (ramp) osc.frequency.exponentialRampToValueAtTime(ramp, ctx.currentTime + duration);
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  },
  commit() {
    this._play(600, 'sine', 0.12, 0.08);
    setTimeout(() => this._play(900, 'sine', 0.1, 0.06), 60);
  },
  prMerged() {
    this._play(523, 'sine', 0.15, 0.1);
    setTimeout(() => this._play(659, 'sine', 0.15, 0.1), 100);
    setTimeout(() => this._play(784, 'sine', 0.2, 0.1), 200);
  },
  prOpened() {
    this._play(440, 'triangle', 0.15, 0.08);
    setTimeout(() => this._play(554, 'triangle', 0.15, 0.08), 100);
  },
  review() {
    this._play(700, 'sine', 0.1, 0.06);
  },
  issueClosed() {
    this._play(500, 'sine', 0.1, 0.07);
    setTimeout(() => this._play(750, 'sine', 0.15, 0.07), 80);
  },
  levelUp() {
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      setTimeout(() => this._play(f, 'sine', 0.2, 0.12), i * 120);
    });
  },
  badgeEarned() {
    this._play(880, 'sine', 0.1, 0.1);
    setTimeout(() => this._play(1100, 'sine', 0.1, 0.1), 80);
    setTimeout(() => this._play(1320, 'sine', 0.25, 0.12), 160);
  },
  bossDefeated() {
    const notes = [392, 494, 587, 784, 988, 784, 988, 1175];
    notes.forEach((f, i) => {
      setTimeout(() => this._play(f, 'sine', 0.25, 0.14), i * 100);
    });
  },
  overtaken() {
    this._play(300, 'sawtooth', 0.3, 0.06, 600);
  },
  streak() {
    this._play(660, 'triangle', 0.12, 0.08);
    setTimeout(() => this._play(880, 'triangle', 0.15, 0.08), 100);
    setTimeout(() => this._play(1100, 'triangle', 0.2, 0.1), 200);
  },
};

// ===================================================================
// AMBIENT PARTICLES
// ===================================================================
function spawnAmbientParticles() {
  const container = document.getElementById('particles');
  if (!container) return;
  const colors = ['rgba(124,58,237,.4)','rgba(34,211,238,.3)','rgba(251,191,36,.3)','rgba(16,185,129,.3)'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 1920 + 'px';
    p.style.top = (200 + Math.random() * 800) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width = (2 + Math.random() * 3) + 'px';
    p.style.height = p.style.width;
    p.style.animationDelay = (Math.random() * 8) + 's';
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    container.appendChild(p);
  }
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

function formatDuration(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function getWeekStart(resetDay = CONFIG.weeklyResetDay) {
  const now = new Date();
  const day = now.getDay();
  const diff = (day - resetDay + 7) % 7;
  const start = new Date(now);
  start.setDate(now.getDate() - diff);
  start.setHours(0, 0, 0, 0);
  return start;
}

function getTodayStart() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===================================================================
// LEVELS & XP
// ===================================================================
const LEVELS = [
  { level: 1, xp: 0, title: 'Intern' },
  { level: 2, xp: 500, title: 'Junior Dev' },
  { level: 3, xp: 1500, title: 'Dev' },
  { level: 4, xp: 3000, title: 'Senior Dev' },
  { level: 5, xp: 6000, title: 'Staff Engineer' },
  { level: 6, xp: 10000, title: 'Principal' },
  { level: 7, xp: 16000, title: 'Architect' },
  { level: 8, xp: 25000, title: 'Legendary' },
];

function getLevel(xp) {
  let lv = LEVELS[0];
  for (const l of LEVELS) if (xp >= l.xp) lv = l;
  return lv;
}

function getNextLevel(xp) {
  for (const l of LEVELS) if (xp < l.xp) return l;
  return null;
}

function getLevelProgress(xp) {
  const cur = getLevel(xp);
  const next = getNextLevel(xp);
  if (!next) return 1;
  return (xp - cur.xp) / (next.xp - cur.xp);
}

const XP_VALUES = {
  commit: 50,
  prOpened: 80,
  prMerged: 120,
  prReviewed: 60,
  issueClosed: 40,
  firstCommitOfDay: 30,
  netNegativePR: 70,
  streakMilestone: 200,
};

// ===================================================================
// BADGES
// ===================================================================
const BADGE_DEFS = [
  { id:'earlyBird',   name:'Early Bird',     icon:'🐦', rarity:'common',    desc:'First commit before 9am' },
  { id:'nightOwl',    name:'Night Owl',      icon:'🦉', rarity:'common',    desc:'Commit after 11pm' },
  { id:'quickDraw',   name:'Quick Draw',     icon:'⚡', rarity:'common',    desc:'PR reviewed within 1h' },
  { id:'closer',      name:'Closer',         icon:'🎯', rarity:'common',    desc:'Close 5 issues in a day' },
  { id:'surgeon',     name:'The Surgeon',    icon:'🔪', rarity:'rare',      desc:'PR with >90% deletions' },
  { id:'streakMaster',name:'Streak Master',  icon:'🔥', rarity:'rare',      desc:'7-day commit streak' },
  { id:'reviewerWeek',name:'Reviewer of Week',icon:'👁️',rarity:'rare',      desc:'Most PR reviews in a week' },

];

function getBadgeDef(id) { return BADGE_DEFS.find(b => b.id === id); }

// ===================================================================
// PERSISTENCE (localStorage)
// ===================================================================
const STORAGE_KEY = 'mergeglory_state';

function saveState() {
  try {
    const persist = {
      devStats: STATE.devStats,
      bossProgress: STATE.bossProgress,
      bossIndex: STATE.boss ? CONFIG.bossGoals.indexOf(STATE.boss) : 0,
      bossDefeatedAt: STATE.bossDefeatedAt,
      weekStart: STATE.weekStart?.toISOString(),
      previousRanks: STATE.previousRanks,
      belts: STATE.belts,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(persist));
  } catch(e) { /* ignore quota errors */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    const savedWeekStart = data.weekStart ? new Date(data.weekStart) : null;
    const currentWeekStart = getWeekStart();
    // Weekly reset check
    if (savedWeekStart && savedWeekStart < currentWeekStart) {
      // Reset weekly XP but keep badges and streaks
      for (const login of Object.keys(data.devStats || {})) {
        const ds = data.devStats[login];
        ds.weeklyXp = 0;
        ds.weeklyCommits = 0;
        ds.weeklyPRsOpened = 0;
        ds.weeklyPRsMerged = 0;
        ds.weeklyPRsReviewed = 0;
        ds.weeklyIssuesClosed = 0;
        ds.weeklyLinesAdded = 0;
        ds.weeklyLinesDeleted = 0;
      }
      data.bossProgress = 0;
      data.previousRanks = {};
    }
    if (data.devStats) STATE.devStats = data.devStats;
    if (data.bossProgress != null) STATE.bossProgress = data.bossProgress;
    if (data.bossDefeatedAt) STATE.bossDefeatedAt = data.bossDefeatedAt;
    if (data.previousRanks) STATE.previousRanks = data.previousRanks;
    if (data.belts) STATE.belts = data.belts;
    STATE.weekStart = currentWeekStart;
    // Set boss
    const bi = data.bossIndex || 0;
    STATE.boss = CONFIG.bossGoals[bi % CONFIG.bossGoals.length];
  } catch(e) { /* ignore parse errors */ }
}

// ===================================================================
// GITHUB API
// ===================================================================
const API = 'https://api.github.com';
const headers = () => ({
  'Authorization': `Bearer ${CONFIG.pat}`,
  'Accept': 'application/vnd.github.v3+json',
});

async function apiFetch(url) {
  const resp = await fetch(url.startsWith('http') ? url : API + url, { headers: headers() });
  if (!resp.ok) {
    console.warn(`API error ${resp.status}: ${url}`);
    return null;
  }
  return resp.json();
}

async function apiFetchAll(url) {
  let results = [];
  let page = 1;
  const sep = url.includes('?') ? '&' : '?';
  while (true) {
    const data = await apiFetch(`${url}${sep}per_page=100&page=${page}`);
    if (!data || !Array.isArray(data) || data.length === 0) break;
    results = results.concat(data);
    if (data.length < 100) break;
    page++;
    if (page > 5) break; // safety limit
  }
  return results;
}

// ===================================================================
// REAL-TIME EVENT STREAM (GitHub Events API with ETag)
// ===================================================================
let eventsETag = null;
let processedEventIds = new Set();
let eventPollTimer = null;

async function pollEvents() {
  try {
    const url = `${API}/orgs/${encodeURIComponent(CONFIG.org)}/events?per_page=100`;
    const opts = { headers: headers() };
    if (eventsETag) {
      opts.headers['If-None-Match'] = eventsETag;
    }
    const resp = await fetch(url, opts);

    // 304 = no new events, skip (costs 0 rate limit)
    if (resp.status === 304) return;
    if (!resp.ok) {
      console.warn('Events API error:', resp.status);
      return;
    }

    // Store ETag for conditional next request
    const newETag = resp.headers.get('ETag');
    if (newETag) eventsETag = newETag;

    // Check X-Poll-Interval header (GitHub tells us how often to poll)
    const pollHint = parseInt(resp.headers.get('X-Poll-Interval'), 10);
    if (pollHint && pollHint > 0 && eventPollTimer) {
      clearInterval(eventPollTimer);
      eventPollTimer = setInterval(pollEvents, Math.max(pollHint, 10) * 1000);
      console.log(`MergeGlory: GitHub suggests poll interval ${pollHint}s`);
    }

    const events = await resp.json();
    if (!Array.isArray(events) || events.length === 0) return;

    let hasChanges = false;
    // Process events newest-first, but we want to apply oldest-first for correct ordering
    const newEvents = events.filter(e => !processedEventIds.has(e.id)).reverse();

    for (const event of newEvents) {
      processedEventIds.add(event.id);
      const changed = processEvent(event);
      if (changed) hasChanges = true;
    }

    // Cap processed IDs set to avoid memory leak
    if (processedEventIds.size > 5000) {
      const arr = [...processedEventIds];
      processedEventIds = new Set(arr.slice(arr.length - 2000));
    }

    if (hasChanges) {
      recalcXP();
      recalcBelts();
      recalcBoss();
      checkRankChanges();
      saveState();
      renderAll();
    }
  } catch (err) {
    console.warn('Event poll error:', err);
  }
}

function processEvent(event) {
  const actor = event.actor?.login;
  const repo = event.repo?.name?.split('/').pop() || '';
  const createdAt = event.created_at;
  const todayStart = getTodayStart();

  // Ensure actor is tracked — auto-add anyone who appears in org events
  if (actor && !STATE.members.some(m => m.login === actor)) {
    STATE.members.push({ login: actor, name: actor, avatarUrl: event.actor?.avatar_url || '', color: getColor(actor) });
  }
  if (actor && !STATE.devStats[actor]) {
    STATE.devStats[actor] = initDevStats(actor);
  }
  if (!actor || !STATE.devStats[actor]) return false;
  const ds = STATE.devStats[actor];

  switch (event.type) {
    case 'PushEvent': {
      const commits = event.payload?.commits || [];
      const commitCount = event.payload?.distinct_size || commits.length;
      ds.weeklyCommits += commitCount;
      const pushDate = new Date(createdAt);
      if (pushDate >= todayStart) ds.dailyCommits += commitCount;
      ds.lastCommitDate = createdAt;
      ds.lastActivityTime = createdAt;
      STATE.lastCommitTime = Math.max(STATE.lastCommitTime, pushDate.getTime());
      STATE.orgStats.commits += commitCount;
      STATE.orgStats.commitsToday += (pushDate >= todayStart ? commitCount : 0);

      // Badge checks
      const hour = pushDate.getHours();
      if (hour < 9 && !ds.badges.includes('earlyBird')) {
        ds.badges.push('earlyBird');
        awardBadge(actor, 'earlyBird');
      }
      if (hour >= 23 && !ds.badges.includes('nightOwl')) {
        ds.badges.push('nightOwl');
        awardBadge(actor, 'nightOwl');
      }

      // Streak
      if (!ds.streakLastDate || isNewDay(ds.streakLastDate)) {
        ds.streak = (ds.streak || 0) + 1;
        ds.streakLastDate = new Date().toISOString();
        if ([3, 7, 14, 30].includes(ds.streak)) {
          addFeedItem('streak', actor, repo, `reached a ${ds.streak}-day streak! 🔥`, '', XP_VALUES.streakMilestone, createdAt);
          SFX.streak();
        }
        if (ds.streak >= 7 && !ds.badges.includes('streakMaster')) { ds.badges.push('streakMaster'); awardBadge(actor, 'streakMaster'); }
        if (ds.streak >= 30 && !ds.badges.includes('ironDev')) { ds.badges.push('ironDev'); awardBadge(actor, 'ironDev'); }
      }
      if (ds.streak > (ds.longestStreak || 0)) ds.longestStreak = ds.streak;

      // Feed: show each commit
      for (const c of commits.slice(0, 3)) {
        addFeedItem('commit', actor, repo, 'pushed a commit', (c.message || '').split('\n')[0].substring(0, 60), XP_VALUES.commit, createdAt);
      }
      SFX.commit();
      return true;
    }

    case 'PullRequestEvent': {
      const action = event.payload?.action;
      const pr = event.payload?.pull_request;
      if (action === 'opened') {
        ds.weeklyPRsOpened++;
        ds.lastActivityTime = createdAt;
        addFeedItem('pr-opened', actor, repo, 'opened a PR', (pr?.title || '').substring(0, 50), XP_VALUES.prOpened, createdAt);
        SFX.prOpened();
        return true;
      }
      if (action === 'closed' && pr?.merged) {
        ds.weeklyPRsMerged++;
        ds.lastActivityTime = createdAt;
        STATE.orgStats.prsMerged++;
        addFeedItem('pr-merged', actor, repo, 'merged a PR', (pr?.title || '').substring(0, 50), XP_VALUES.prMerged, createdAt);
        SFX.prMerged();
        // Badge: Speed Demon
        if (pr.created_at && pr.merged_at) {
          const diff = new Date(pr.merged_at) - new Date(pr.created_at);
          if (diff < 2 * 60 * 60 * 1000 && !ds.badges.includes('speedDemon')) {
            ds.badges.push('speedDemon');
            awardBadge(actor, 'speedDemon');
          }
        }
        // Badge: The Surgeon (>90% deletions)
        if (pr.deletions && pr.additions != null) {
          const total = pr.additions + pr.deletions;
          if (total > 0 && pr.deletions / total > 0.9 && !ds.badges.includes('surgeon')) {
            ds.badges.push('surgeon');
            awardBadge(actor, 'surgeon');
          }
        }
        return true;
      }
      return false;
    }

    case 'PullRequestReviewEvent': {
      ds.weeklyPRsReviewed++;
      ds.lastActivityTime = createdAt;
      const prTitle = event.payload?.pull_request?.title || '';
      addFeedItem('review', actor, repo, 'reviewed a PR', prTitle.substring(0, 50), XP_VALUES.prReviewed, createdAt);
      SFX.review();
      // Badge: Quick Draw (reviewed within 1h of PR creation)
      const prCreated = event.payload?.pull_request?.created_at;
      if (prCreated) {
        const diff = new Date(createdAt) - new Date(prCreated);
        if (diff < 60 * 60 * 1000 && !ds.badges.includes('quickDraw')) {
          ds.badges.push('quickDraw');
          awardBadge(actor, 'quickDraw');
        }
      }
      return true;
    }

    case 'IssuesEvent': {
      if (event.payload?.action === 'closed') {
        ds.weeklyIssuesClosed++;
        ds.dailyIssuesClosed++;
        ds.lastActivityTime = createdAt;
        STATE.orgStats.issuesClosed++;
        const issueTitle = event.payload?.issue?.title || '';
        addFeedItem('issue', actor, repo, 'closed an issue', issueTitle.substring(0, 50), XP_VALUES.issueClosed, createdAt);
        SFX.issueClosed();
        // Badge: Closer (5 issues in a day)
        if (ds.dailyIssuesClosed >= 5 && !ds.badges.includes('closer')) {
          ds.badges.push('closer');
          awardBadge(actor, 'closer');
        }
        // Badge: Ghost Slayer (10+ issues in a week)
        if (ds.weeklyIssuesClosed >= 10 && !ds.badges.includes('ghostSlayer')) {
          ds.badges.push('ghostSlayer');
          awardBadge(actor, 'ghostSlayer');
        }
        return true;
      }
      return false;
    }

    case 'IssueCommentEvent':
    case 'CommitCommentEvent':
    case 'PullRequestReviewCommentEvent': {
      ds.lastActivityTime = createdAt;
      return false; // tracked but no XP
    }

    case 'CreateEvent': {
      // Branch/tag creation — no XP but shows activity
      if (event.payload?.ref_type === 'branch') {
        ds.lastActivityTime = createdAt;
        addFeedItem('commit', actor, repo, `created branch ${event.payload.ref || ''}`, '', 0, createdAt);
      }
      return false;
    }

    case 'DeleteEvent': {
      ds.lastActivityTime = createdAt;
      return false;
    }

    case 'ReleaseEvent': {
      if (event.payload?.action === 'published') {
        ds.lastActivityTime = createdAt;
        const tag = event.payload?.release?.tag_name || '';
        addFeedItem('pr-merged', actor, repo, `published release ${tag}`, '', 0, createdAt);
        return true;
      }
      return false;
    }

    default:
      return false;
  }
}

function addFeedItem(type, user, repo, message, detail, xp, time) {
  const key = `${time}_${user}_${type}_${detail}`;
  if (STATE.activityFeed.some(f => `${f.time}_${f.user}_${f.type}_${f.detail}` === key)) return;
  STATE.activityFeed.unshift({ type, user, repo, message, detail, xp, time });
  STATE.activityFeed = STATE.activityFeed.slice(0, 50);
}

function recalcXP() {
  for (const login of Object.keys(STATE.devStats)) {
    const ds = STATE.devStats[login];
    const oldLevel = getLevel(ds.weeklyXp);
    let xp = 0;
    xp += ds.weeklyCommits * XP_VALUES.commit;
    xp += ds.weeklyPRsOpened * XP_VALUES.prOpened;
    xp += ds.weeklyPRsMerged * XP_VALUES.prMerged;
    xp += ds.weeklyPRsReviewed * XP_VALUES.prReviewed;
    xp += ds.weeklyIssuesClosed * XP_VALUES.issueClosed;
    if (ds.dailyCommits > 0) xp += XP_VALUES.firstCommitOfDay;
    if (ds.weeklyLinesDeleted > ds.weeklyLinesAdded && ds.weeklyPRsMerged > 0) xp += XP_VALUES.netNegativePR;
    if (ds.streak >= 3) xp += XP_VALUES.streakMilestone;
    if (ds.streak >= 7) xp += XP_VALUES.streakMilestone;
    if (ds.streak >= 14) xp += XP_VALUES.streakMilestone;
    if (ds.streak >= 30) xp += XP_VALUES.streakMilestone;
    ds.weeklyXp = xp;
    ds.totalXp = xp;
    const newLevel = getLevel(xp);
    if (newLevel.level > oldLevel.level) {
      showLevelUp(login, newLevel);
      addFeedItem('level-up', login, '', `leveled up to ${newLevel.title}!`, `Level ${newLevel.level}`, 0, new Date().toISOString());
    }
  }
}

function recalcBelts() {
  let topReviewer = null, topReviewCount = 0;
  let topCloser = null, topCloseCount = 0;
  for (const m of STATE.members) {
    const ds = STATE.devStats[m.login];
    if (!ds) continue;
    if (ds.weeklyPRsReviewed > topReviewCount) { topReviewer = m.login; topReviewCount = ds.weeklyPRsReviewed; }
    if (ds.weeklyIssuesClosed > topCloseCount) { topCloser = m.login; topCloseCount = ds.weeklyIssuesClosed; }
  }
  STATE.belts.reviewer = topReviewer;
  STATE.belts.closer = topCloser;
}

function recalcBoss() {
  if (!STATE.boss) return;
  STATE.bossProgress = STATE.orgStats[STATE.boss.metric] || 0;
  if (STATE.bossProgress >= STATE.boss.target && !STATE.bossDefeatedAt) {
    STATE.bossDefeatedAt = new Date().toISOString();
    showBossVictory();
    setTimeout(() => {
      const currentIdx = CONFIG.bossGoals.indexOf(STATE.boss);
      STATE.boss = { ...CONFIG.bossGoals[(currentIdx + 1) % CONFIG.bossGoals.length] };
      STATE.boss.target = Math.ceil(STATE.boss.target * 1.2);
      STATE.bossProgress = 0;
      STATE.bossDefeatedAt = null;
      renderBossBar();
    }, 8000);
  }
}

function checkRankChanges() {
  const ranked = getRankedDevs();
  for (let i = 0; i < ranked.length; i++) {
    const login = ranked[i].login;
    const oldRank = STATE.previousRanks[login];
    if (oldRank != null && oldRank > i + 1) {
      showOvertaken(login, oldRank, i + 1);
    }
    STATE.previousRanks[login] = i + 1;
  }
}

async function fetchOrgMembers() {
  const org = encodeURIComponent(CONFIG.org);
  // Fetch org members AND outside collaborators in parallel
  const [members, collabs] = await Promise.all([
    apiFetchAll(`/orgs/${org}/members`),
    apiFetchAll(`/orgs/${org}/outside_collaborators`),
  ]);
  const allUsers = new Map();
  for (const m of (members || [])) {
    allUsers.set(m.login, { login: m.login, name: m.login, avatarUrl: m.avatar_url, color: getColor(m.login) });
  }
  for (const c of (collabs || [])) {
    if (!allUsers.has(c.login)) {
      allUsers.set(c.login, { login: c.login, name: c.login, avatarUrl: c.avatar_url, color: getColor(c.login) });
    }
  }
  STATE.members = [...allUsers.values()];
  console.log(`MergeGlory: ${members?.length || 0} org members + ${collabs?.length || 0} outside collaborators = ${STATE.members.length} total`);
  // Init devStats for new members
  for (const m of STATE.members) {
    if (!STATE.devStats[m.login]) {
      STATE.devStats[m.login] = initDevStats(m.login);
    }
  }
}

function initDevStats(login) {
  return {
    login,
    totalXp: 0,
    weeklyXp: 0,
    weeklyCommits: 0,
    weeklyPRsOpened: 0,
    weeklyPRsMerged: 0,
    weeklyPRsReviewed: 0,
    weeklyIssuesClosed: 0,
    weeklyLinesAdded: 0,
    weeklyLinesDeleted: 0,
    dailyCommits: 0,
    lastCommitDate: null,
    streak: 0,
    longestStreak: 0,
    badges: [],  // array of badge IDs
    lastActivityTime: null,
    dailyIssuesClosed: 0,
    avgReviewTimeMs: null,
    firstCommitToday: false,
  };
}

async function fetchOrgRepos() {
  if (CONFIG.repos.length > 0) {
    STATE.repos = CONFIG.repos;
    return;
  }
  const repos = await apiFetchAll(`/orgs/${encodeURIComponent(CONFIG.org)}/repos`);
  if (repos) {
    STATE.repos = repos.map(r => r.name);
  }
}

// Background full sync — uses Search API (fast, ~10 calls total) instead of per-repo loops
async function fetchAllData() {
  console.log('MergeGlory: Starting full data sync...');
  try {
    const weekStart = getWeekStart();
    const since = weekStart.toISOString();
    const sinceDate = since.split('T')[0];
    const todayStart = getTodayStart();
    const org = encodeURIComponent(CONFIG.org);

    // Reset counters before recalculating
    for (const login of Object.keys(STATE.devStats)) {
      const ds = STATE.devStats[login];
      ds.weeklyCommits = 0; ds.weeklyPRsOpened = 0; ds.weeklyPRsMerged = 0;
      ds.weeklyPRsReviewed = 0; ds.weeklyIssuesClosed = 0;
      ds.weeklyLinesAdded = 0; ds.weeklyLinesDeleted = 0;
      ds.dailyCommits = 0; ds.dailyIssuesClosed = 0; ds.firstCommitToday = false;
    }

    // === PARALLEL BATCH 1: All search queries at once (4 calls) ===
    const [prsOpened, prsMerged, issuesClosed, openPRs] = await Promise.all([
      apiFetch(`/search/issues?q=org:${org}+type:pr+created:>=${sinceDate}&per_page=100`),
      apiFetch(`/search/issues?q=org:${org}+type:pr+is:merged+closed:>=${sinceDate}&per_page=100`),
      apiFetch(`/search/issues?q=org:${org}+type:issue+is:closed+closed:>=${sinceDate}&per_page=100`),
      apiFetch(`/search/issues?q=org:${org}+type:pr+is:open+review:none&per_page=20`),
    ]);

    // Process PRs opened
    if (prsOpened?.items) {
      for (const pr of prsOpened.items) {
        const login = pr.user?.login;
        if (login && STATE.devStats[login]) STATE.devStats[login].weeklyPRsOpened++;
      }
      for (const pr of prsOpened.items.slice(0, 5)) {
        const login = pr.user?.login;
        if (!login) continue;
        addFeedItem('pr-opened', login, pr.repository_url?.split('/').pop() || '', 'opened a PR', (pr.title || '').substring(0, 50), XP_VALUES.prOpened, pr.created_at);
      }
    }

    // Process PRs merged
    if (prsMerged?.items) {
      for (const pr of prsMerged.items) {
        const login = pr.user?.login;
        if (login && STATE.devStats[login]) {
          STATE.devStats[login].weeklyPRsMerged++;
          if (pr.created_at && pr.closed_at) {
            const diff = new Date(pr.closed_at) - new Date(pr.created_at);
            if (diff < 2 * 60 * 60 * 1000 && !STATE.devStats[login].badges.includes('speedDemon')) {
              STATE.devStats[login].badges.push('speedDemon');
              awardBadge(login, 'speedDemon');
            }
          }
        }
      }
      for (const pr of prsMerged.items.slice(0, 5)) {
        const login = pr.user?.login;
        if (!login) continue;
        addFeedItem('pr-merged', login, pr.repository_url?.split('/').pop() || '', 'merged a PR', (pr.title || '').substring(0, 50), XP_VALUES.prMerged, pr.closed_at);
      }
    }

    // Process issues closed
    if (issuesClosed?.items) {
      for (const issue of issuesClosed.items) {
        // Attribute to assignee or closer
        const login = issue.assignee?.login || issue.user?.login;
        if (login && STATE.devStats[login]) STATE.devStats[login].weeklyIssuesClosed++;
      }
    }

    // Shame PRs
    STATE.shamePRs = [];
    if (openPRs?.items) {
      for (const pr of openPRs.items) {
        const age = Date.now() - new Date(pr.created_at).getTime();
        if (age > 24 * 60 * 60 * 1000) {
          STATE.shamePRs.push({
            title: pr.title,
            repo: pr.repository_url?.split('/').pop() || '',
            author: pr.user?.login || '',
            age, url: pr.html_url,
          });
        }
      }
    }

    // === PARALLEL BATCH 2: Per-member reviews (4 members = 4 calls) ===
    await Promise.all(STATE.members.map(async (m) => {
      const reviews = await apiFetch(`/search/issues?q=reviewed-by:${encodeURIComponent(m.login)}+type:pr+org:${org}+updated:>=${sinceDate}&per_page=100`);
      if (reviews?.total_count != null) STATE.devStats[m.login].weeklyPRsReviewed = reviews.total_count;
    }));

    // === PARALLEL BATCH 3: Recent commits via org events (1 call covers all repos) ===
    const events = await apiFetch(`/orgs/${org}/events?per_page=100`);
    if (events && Array.isArray(events)) {
      for (const event of events) {
        if (event.type !== 'PushEvent') continue;
        const login = event.actor?.login;
        if (!login || !STATE.devStats[login]) continue;
        const ds = STATE.devStats[login];
        const pushDate = new Date(event.created_at);
        if (pushDate < weekStart) continue;
        const commits = event.payload?.distinct_size || event.payload?.commits?.length || 0;
        ds.weeklyCommits += commits;
        if (pushDate >= todayStart) ds.dailyCommits += commits;
        if (pushDate.getTime() > STATE.lastCommitTime) STATE.lastCommitTime = pushDate.getTime();
        ds.lastActivityTime = event.created_at;
        ds.lastCommitDate = event.created_at;
        // Feed items for recent pushes
        const repo = event.repo?.name?.split('/').pop() || '';
        for (const c of (event.payload?.commits || []).slice(0, 2)) {
          addFeedItem('commit', login, repo, 'pushed a commit', (c.message || '').split('\n')[0].substring(0, 60), XP_VALUES.commit, event.created_at);
        }
        // Badge checks
        const hour = pushDate.getHours();
        if (hour < 9 && !ds.badges.includes('earlyBird')) { ds.badges.push('earlyBird'); awardBadge(login, 'earlyBird'); }
        if (hour >= 23 && !ds.badges.includes('nightOwl')) { ds.badges.push('nightOwl'); awardBadge(login, 'nightOwl'); }
      }
    }

    // Org-wide stats
    STATE.orgStats.prsMerged = prsMerged?.total_count || 0;
    STATE.orgStats.issuesClosed = 0; STATE.orgStats.commits = 0; STATE.orgStats.commitsToday = 0;
    for (const login of Object.keys(STATE.devStats)) {
      STATE.orgStats.issuesClosed += STATE.devStats[login].weeklyIssuesClosed;
      STATE.orgStats.commits += STATE.devStats[login].weeklyCommits;
      STATE.orgStats.commitsToday += STATE.devStats[login].dailyCommits;
    }

    // Recalc everything
    recalcXP();
    recalcBelts();
    recalcBoss();

    // Streak calculation
    for (const m of STATE.members) {
      const ds = STATE.devStats[m.login];
      if (ds.dailyCommits > 0 && (!ds.streakLastDate || isNewDay(ds.streakLastDate))) {
        ds.streak = (ds.streak || 0) + 1;
        ds.streakLastDate = new Date().toISOString();
        if ([3, 7, 14, 30].includes(ds.streak)) {
          addFeedItem('streak', m.login, '', `reached a ${ds.streak}-day streak! 🔥`, '', XP_VALUES.streakMilestone, new Date().toISOString());
        }
        if (ds.streak >= 7 && !ds.badges.includes('streakMaster')) { ds.badges.push('streakMaster'); awardBadge(m.login, 'streakMaster'); }
        if (ds.streak >= 30 && !ds.badges.includes('ironDev')) { ds.badges.push('ironDev'); awardBadge(m.login, 'ironDev'); }
      }
      if (ds.streak > (ds.longestStreak || 0)) ds.longestStreak = ds.streak;
    }

    // Badge checks
    for (const m of STATE.members) {
      const ds = STATE.devStats[m.login];
      if (ds.weeklyIssuesClosed >= 5 && !ds.badges.includes('closer')) { ds.badges.push('closer'); awardBadge(m.login, 'closer'); }
      if (ds.weeklyIssuesClosed >= 10 && !ds.badges.includes('ghostSlayer')) { ds.badges.push('ghostSlayer'); awardBadge(m.login, 'ghostSlayer'); }
      if (ds.weeklyLinesDeleted > ds.weeklyLinesAdded && ds.weeklyLinesDeleted > 0 && !ds.badges.includes('janitor')) { ds.badges.push('janitor'); awardBadge(m.login, 'janitor'); }
    }

    checkRankChanges();
    saveState();
    renderAll();
    console.log('MergeGlory: Full sync complete');
  } catch (err) {
    console.error('MergeGlory: Full sync error:', err);
    renderAll(); // Still render what we have
  }
}

function isNewDay(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return d.toDateString() !== now.toDateString();
}

function getRankedDevs() {
  return Object.values(STATE.devStats)
    .filter(ds => STATE.members.some(m => m.login === ds.login))
    .sort((a, b) => b.weeklyXp - a.weeklyXp);
}

function awardBadge(login, badgeId) {
  const def = getBadgeDef(badgeId);
  if (!def) return;
  SFX.badgeEarned();
  STATE.recentBadge = { login, badge: def, time: Date.now() };
  STATE.activityFeed.unshift({
    type: 'badge',
    user: login,
    repo: '',
    message: `earned ${def.name} ${def.icon}`,
    detail: def.desc,
    xp: 0,
    time: new Date().toISOString(),
  });
}

// --- Boss Bar ---
function renderBossBar() {
  if (!STATE.boss) return;
  const el = (id) => document.getElementById(id);
  el('bossLabel').textContent = STATE.boss.label;
  const pct = Math.min(100, (STATE.bossProgress / STATE.boss.target) * 100);
  el('bossFill').style.width = pct + '%';
  el('bossStats').textContent = `${STATE.bossProgress} / ${STATE.boss.target}`;
  // Timer: time remaining in week
  const weekEnd = new Date(getWeekStart());
  weekEnd.setDate(weekEnd.getDate() + 7);
  const remaining = weekEnd - Date.now();
  el('bossTimer').textContent = remaining > 0 ? `⏱ ${formatDuration(remaining)}` : '⏱ 00:00:00';
}

// --- Leaderboard ---
function renderLeaderboard() {
  const lbList = document.getElementById('lbList');
  const ranked = getRankedDevs();
  let html = '';
  for (let i = 0; i < ranked.length; i++) {
    const ds = ranked[i];
    const member = STATE.members.find(m => m.login === ds.login);
    if (!member) continue;
    const rank = i + 1;
    const level = getLevel(ds.weeklyXp);
    const progress = getLevelProgress(ds.weeklyXp);
    const isGhost = ds.lastActivityTime && (Date.now() - new Date(ds.lastActivityTime).getTime() > 3 * 24 * 60 * 60 * 1000);
    const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    const rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
    const streakDisplay = ds.streak > 0 ? `🔥${ds.streak}` : '';

    // Belts
    let beltsHtml = '';
    if (STATE.belts.reviewer === ds.login) beltsHtml += '<span class="lb-belt" title="Top Reviewer">👁️</span>';
    if (STATE.belts.closer === ds.login) beltsHtml += '<span class="lb-belt" title="Top Closer">🎯</span>';
    if (STATE.belts.speedKing === ds.login) beltsHtml += '<span class="lb-belt" title="Speed King">👑</span>';

    html += `
      <div class="lb-row ${rank <= 3 ? 'rank-' + rank : ''}" data-login="${escapeHtml(ds.login)}" id="lb-row-${escapeHtml(ds.login)}">
        <div class="lb-rank ${rankClass}">${rankIcon}</div>
        <div class="lb-avatar ${isGhost ? 'ghost' : ''}">${avatarHtml(ds.login, 44)}</div>
        <div class="lb-info">
          <div class="lb-name">${escapeHtml(member.name)}</div>
          <div class="lb-title">${level.title}</div>
        </div>
        <div class="lb-belts">${beltsHtml}</div>
        <div class="lb-streak">${streakDisplay}</div>
        <div class="lb-xp">${ds.weeklyXp.toLocaleString()} XP</div>
        <div class="lb-bar"><div class="lb-bar-fill" style="width:${Math.round(progress * 100)}%"></div></div>
      </div>`;
  }
  lbList.innerHTML = html;
}

// --- Activity Feed ---
function renderFeed() {
  const feedList = document.getElementById('feedList');
  const feedTimer = document.getElementById('feedTimer');

  // Last commit timer
  const elapsed = Date.now() - STATE.lastCommitTime;
  const mins = Math.floor(elapsed / 60000);
  if (mins < 5) {
    feedTimer.textContent = 'Last commit: just now';
    feedTimer.className = 'feed-timer green';
  } else if (mins < 30) {
    feedTimer.textContent = `Last commit: ${mins}m ago`;
    feedTimer.className = 'feed-timer green';
  } else if (mins < 120) {
    feedTimer.textContent = `Last commit: ${mins}m ago`;
    feedTimer.className = 'feed-timer amber';
  } else {
    feedTimer.textContent = `Last commit: ${Math.floor(mins / 60)}h ${mins % 60}m ago`;
    feedTimer.className = 'feed-timer red';
  }

  let html = '';
  for (const item of STATE.activityFeed.slice(0, 20)) {
    const typeIcons = {
      'commit': '💻',
      'pr-opened': '🔀',
      'pr-merged': '✅',
      'review': '👁️',
      'issue': '🎯',
      'badge': '🏅',
      'level-up': '⬆️',
      'streak': '🔥',
    };
    const icon = typeIcons[item.type] || '📌';
    html += `
      <div class="feed-item ${item.type}">
        <div class="feed-avatar">${avatarHtml(item.user, 36)}</div>
        <div class="feed-content">
          <div class="feed-action"><strong>${escapeHtml(item.user)}</strong> <span>${escapeHtml(item.message)}</span></div>
          ${item.detail ? `<div class="feed-repo">${icon} ${escapeHtml(item.detail)}${item.repo ? ' · ' + escapeHtml(item.repo) : ''}</div>` : (item.repo ? `<div class="feed-repo">${icon} ${escapeHtml(item.repo)}</div>` : '')}
        </div>
        ${item.xp > 0 ? `<div class="feed-xp">+${item.xp} XP</div>` : ''}
        <div class="feed-time">${timeAgo(item.time)}</div>
      </div>`;
  }
  feedList.innerHTML = html;
}

const SPOTLIGHT_MODES = ['mvp', 'badge', 'duel', 'funStat', 'streakWall', 'shame', 'velocity', 'trophyCase'];
let spotlightTimer = null;

function renderSpotlight() {
  const container = document.getElementById('spotlightContainer');
  const titleEl = document.getElementById('spotlightTitle');
  const dotsEl = document.getElementById('spotlightDots');

  // Render dots
  let dots = '';
  for (let i = 0; i < SPOTLIGHT_MODES.length; i++) {
    dots += `<div class="spotlight-dot ${i === STATE.spotlightIndex ? 'active' : ''}"></div>`;
  }
  dotsEl.innerHTML = dots;

  const mode = SPOTLIGHT_MODES[STATE.spotlightIndex];
  switch (mode) {
    case 'mvp': renderSpotlightMVP(container, titleEl); break;
    case 'badge': renderSpotlightBadge(container, titleEl); break;
    case 'duel': renderSpotlightDuel(container, titleEl); break;
    case 'funStat': renderSpotlightFunStat(container, titleEl); break;
    case 'streakWall': renderSpotlightStreaks(container, titleEl); break;
    case 'shame': renderSpotlightShame(container, titleEl); break;
    case 'velocity': renderSpotlightVelocity(container, titleEl); break;
    case 'trophyCase': renderSpotlightTrophies(container, titleEl); break;
  }
}

function renderSpotlightMVP(container, titleEl) {
  titleEl.textContent = "🏆 THIS WEEK'S MVP";
  const ranked = getRankedDevs();
  if (ranked.length === 0) { container.innerHTML = '<div style="color:var(--text3)">No data yet</div>'; return; }
  const mvp = ranked[0];
  const member = STATE.members.find(m => m.login === mvp.login) || { color: '#6366f1' };
  const level = getLevel(mvp.weeklyXp);

function renderSpotlightVelocity(container, titleEl) {
  titleEl.textContent = '📊 VELOCITY THIS WEEK';
  // Simple bar chart: commits per day-of-week
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const dayIdx = new Date().getDay();
  // We'll show proportional to total
  const totalCommits = STATE.orgStats.commits || 1;
  // Estimate daily distribution (in a real scenario we'd track per-day)
  // For now, simulate with available data
  const perDay = Math.ceil(totalCommits / Math.max(1, ((dayIdx === 0 ? 7 : dayIdx) - CONFIG.weeklyResetDay + 7) % 7 || 1));
  const barsData = days.map((d, i) => {
    const isToday = ((i + CONFIG.weeklyResetDay) % 7) === dayIdx;
    const isPast = ((i + CONFIG.weeklyResetDay) % 7) < dayIdx || (dayIdx === 0 && i < 6);
    return {
      label: d,
      value: isToday ? STATE.orgStats.commitsToday : (isPast ? perDay + Math.floor(Math.random() * 5) : 0),
      isToday,
    };
  });
  const maxVal = Math.max(...barsData.map(b => b.value), 1);
  const barWidth = 80;
  const gap = 30;
  const chartHeight = 120;
  const startX = 60;
  let svg = `<svg class="velocity-chart" viewBox="0 0 900 160">`;
  for (let i = 0; i < barsData.length; i++) {
    const x = startX + i * (barWidth + gap);
    const barH = (barsData[i].value / maxVal) * chartHeight;
    const y = chartHeight - barH + 10;
    const fill = barsData[i].isToday ? '#6366f1' : '#334155';
    svg += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" rx="4" fill="${fill}"/>`;
    svg += `<text x="${x + barWidth/2}" y="${y - 6}" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">${barsData[i].value}</text>`;
    svg += `<text x="${x + barWidth/2}" y="${chartHeight + 30}" text-anchor="middle" fill="#64748b" font-size="12">${barsData[i].label}</text>`;
  }
  svg += '</svg>';
  container.innerHTML = svg;
}

// Demo mode: simulate live updates
function demoTick() {
  if (STATE.members.length === 0) return;
  const user = STATE.members[Math.floor(Math.random() * STATE.members.length)];
  const ds = STATE.devStats[user.login];
  const actions = ['commit', 'pr-merged', 'pr-opened', 'review', 'issue'];
  const action = actions[Math.floor(Math.random() * actions.length)];
  const repos = ['api-server', 'frontend', 'database', 'mobile-app'];
  const repo = repos[Math.floor(Math.random() * repos.length)];
  let xp = 0, message = '', detail = '';
  const commitMessages = ['Fix edge case in parser', 'Update README', 'Refactor utils', 'Add error handling', 'Optimize query', 'Fix typo', 'Clean up code', 'Add logging'];
  const prTitles = ['Implement caching', 'Fix auth flow', 'Add dark mode', 'Update deps', 'Refactor API', 'Add tests'];

  switch (action) {
    case 'commit':
      ds.weeklyCommits++;
      ds.dailyCommits++;
      xp = XP_VALUES.commit;
      message = 'pushed a commit';
      detail = commitMessages[Math.floor(Math.random() * commitMessages.length)];
      ds.lastActivityTime = new Date().toISOString();
      STATE.lastCommitTime = Date.now();
      break;
    case 'pr-merged':
      ds.weeklyPRsMerged++;
      xp = XP_VALUES.prMerged;
      message = 'merged a PR';
      detail = prTitles[Math.floor(Math.random() * prTitles.length)];
      ds.lastActivityTime = new Date().toISOString();
      STATE.orgStats.prsMerged++;
      STATE.bossProgress = Math.min(STATE.bossProgress + 1, STATE.boss?.target || 999);
      break;
    case 'pr-opened':
      ds.weeklyPRsOpened++;
      xp = XP_VALUES.prOpened;
      message = 'opened a PR';
      detail = prTitles[Math.floor(Math.random() * prTitles.length)];
      ds.lastActivityTime = new Date().toISOString();
      break;
    case 'review':
      ds.weeklyPRsReviewed++;
      xp = XP_VALUES.prReviewed;
      message = 'reviewed a PR';
      detail = prTitles[Math.floor(Math.random() * prTitles.length)];
      ds.lastActivityTime = new Date().toISOString();
      break;
    case 'issue':
      ds.weeklyIssuesClosed++;
      xp = XP_VALUES.issueClosed;
      message = 'closed an issue';
      detail = commitMessages[Math.floor(Math.random() * commitMessages.length)];
      ds.lastActivityTime = new Date().toISOString();
      STATE.orgStats.issuesClosed++;
      STATE.bossProgress = Math.min(STATE.bossProgress + 1, STATE.boss?.target || 999);
      break;
  }

  // Recalc XP
  let newXp = 0;
  newXp += ds.weeklyCommits * XP_VALUES.commit;
  newXp += ds.weeklyPRsOpened * XP_VALUES.prOpened;
  newXp += ds.weeklyPRsMerged * XP_VALUES.prMerged;
  newXp += ds.weeklyPRsReviewed * XP_VALUES.prReviewed;
  newXp += ds.weeklyIssuesClosed * XP_VALUES.issueClosed;
  if (ds.dailyCommits > 0) newXp += XP_VALUES.firstCommitOfDay;
  if (ds.weeklyLinesDeleted > ds.weeklyLinesAdded) newXp += XP_VALUES.netNegativePR;
  if (ds.streak >= 3) newXp += XP_VALUES.streakMilestone;
  if (ds.streak >= 7) newXp += XP_VALUES.streakMilestone;
  if (ds.streak >= 14) newXp += XP_VALUES.streakMilestone;
  if (ds.streak >= 30) newXp += XP_VALUES.streakMilestone;

  const oldLevel = getLevel(ds.weeklyXp);
  ds.weeklyXp = newXp;
  ds.totalXp = newXp;
  const newLevel = getLevel(ds.weeklyXp);
  if (newLevel.level > oldLevel.level) {
    showLevelUp(user.login, newLevel);
  }

  // Boss check
  if (STATE.boss && STATE.bossProgress >= STATE.boss.target && !STATE.bossDefeatedAt) {
    STATE.bossDefeatedAt = new Date().toISOString();
    showBossVictory();
    setTimeout(() => {
      const currentIdx = CONFIG.bossGoals.indexOf(STATE.boss);
      STATE.boss = { ...CONFIG.bossGoals[(currentIdx + 1) % CONFIG.bossGoals.length] };
      STATE.boss.target = Math.ceil(STATE.boss.target * 1.2);
      STATE.bossProgress = 0;
      STATE.bossDefeatedAt = null;
      renderBossBar();
    }, 8000);
  }

  // Rank change detection
  const ranked = getRankedDevs();
  for (let i = 0; i < ranked.length; i++) {
    const login = ranked[i].login;
    const oldRank = STATE.previousRanks[login];
    if (oldRank != null && oldRank > i + 1 && i < 5) {
      showOvertaken(login, oldRank, i + 1);
    }
    STATE.previousRanks[login] = i + 1;
  }

  // Feed
  STATE.activityFeed.unshift({
    type: action,
    user: user.login,
    repo,
    message,
    detail,
    xp,
    time: new Date().toISOString(),
  });
  STATE.activityFeed = STATE.activityFeed.slice(0, 50);

  STATE.orgStats.commits = Object.values(STATE.devStats).reduce((s, d) => s + d.weeklyCommits, 0);
  STATE.orgStats.commitsToday = Object.values(STATE.devStats).reduce((s, d) => s + d.dailyCommits, 0);

  // Belt updates
  let topReviewer = null, topReviewCount = 0;
  let topCloser = null, topCloseCount = 0;
  for (const m of STATE.members) {
    const d = STATE.devStats[m.login];
    if (d.weeklyPRsReviewed > topReviewCount) { topReviewer = m.login; topReviewCount = d.weeklyPRsReviewed; }
    if (d.weeklyIssuesClosed > topCloseCount) { topCloser = m.login; topCloseCount = d.weeklyIssuesClosed; }
  }
  STATE.belts.reviewer = topReviewer;
  STATE.belts.closer = topCloser;

  renderAll();
}

// ===================================================================
// INIT
// ===================================================================
async function init() {
  STATE.weekStart = getWeekStart();
  loadState();

  if (!STATE.boss) {
    STATE.boss = CONFIG.bossGoals[0];
  }

  const isDemo = CONFIG.pat === 'ghp_YOUR_PAT_HERE' || !CONFIG.pat;

  if (isDemo) {
    console.log('MergeGlory: Running in DEMO mode (no PAT configured)');
    loadDemoData();
    // Simulate live activity every 5-15s
    setInterval(demoTick, 5000 + Math.random() * 10000);
    setInterval(demoTick, 8000);
  } else {
    console.log('MergeGlory: Connecting to GitHub org:', CONFIG.org);
    await fetchOrgMembers();
    await fetchOrgRepos();
    console.log(`MergeGlory: Tracking ${STATE.repos.length} repos, ${STATE.members.length} members`);

    // RENDER IMMEDIATELY with member list (no more blank screen)
    renderAll();

    // REAL-TIME: Start event stream first (instant results)
    console.log('MergeGlory: Starting real-time event stream...');
    eventPollTimer = setInterval(pollEvents, CONFIG.pollInterval * 1000);
    await pollEvents(); // First poll — gets the latest ~100 events instantly

    // BACKGROUND: Full data sync (search API, ~10 calls total)
    fetchAllData(); // Don't await — runs in background, renders when done

    // Periodic full sync every 5 minutes
    setInterval(fetchAllData, CONFIG.fullSyncInterval * 1000);

    // Refresh repo + member list every 10 minutes
    setInterval(async () => {
      await Promise.all([fetchOrgRepos(), fetchOrgMembers()]);
      console.log(`MergeGlory: Refreshed — ${STATE.repos.length} repos, ${STATE.members.length} members`);
    }, 600000);
  }

  // Spotlight rotation
  setInterval(rotateSpotlight, CONFIG.spotlightInterval * 1000);
  // Timer updates
  setInterval(updateTimers, 10000);
}

init();
</script>
